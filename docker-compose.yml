services:
  # LiveKit SFU Server
  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit
    command: --config /etc/livekit/livekit.conf --node-ip ${LIVEKIT_NODE_IP:-64.227.189.7}
    ports:
      - "7880:7880"   # HTTP/WebSocket
      - "7881:7881"   # RTC over TCP
      - "7882:7882/udp"  # RTC over UDP
    volumes:
      - ./livekit.conf:/etc/livekit/livekit.conf:ro
    # Make host.docker.internal work on Linux (maps to host's IP)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes: {}
